<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobLijiye</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fff;
      color: #1f2937;
    }
    #content {
      padding: 20px;
    }
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
    }
    .logo-icon {
      font-size: 24px;
    }
    .logo-text {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    input {
      padding: 12px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #6366f1;
    }
    button {
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
    }
    .btn-primary:hover {
      opacity: 0.9;
    }
    .btn-secondary {
      background: #f3f4f6;
      color: #374151;
    }
    .btn-secondary:hover {
      background: #e5e7eb;
    }
    .btn-text {
      background: transparent;
      color: #6b7280;
    }
    .btn-text:hover {
      color: #374151;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .profile {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .profile-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 600;
    }
    .profile-name {
      font-weight: 600;
      font-size: 16px;
    }
    .profile-email {
      color: #6b7280;
      font-size: 13px;
    }
    .divider {
      height: 1px;
      background: #e5e7eb;
      margin: 4px 0;
    }
    .warning {
      padding: 10px;
      background: #fef3c7;
      border-radius: 8px;
      font-size: 13px;
      color: #92400e;
    }
    .error {
      color: #dc2626;
      font-size: 13px;
      text-align: center;
    }
    .success {
      color: #16a34a;
      font-size: 13px;
      text-align: center;
    }
    #status {
      min-height: 20px;
      text-align: center;
      font-size: 13px;
    }
    .footer {
      text-align: center;
      margin-top: 16px;
    }
    .footer a {
      color: #6366f1;
      text-decoration: none;
      font-size: 13px;
    }
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="content"></div>
  <script src="popup.js"></script>
</body>
</html>
