<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 320px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .container { padding: 16px; }
    h1 { font-size: 18px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .login-form { display: flex; flex-direction: column; gap: 12px; }
    input { padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 14px; }
    input:focus { outline: none; border-color: #2563eb; }
    button { padding: 10px 16px; background: #2563eb; color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-secondary { background: #f1f5f9; color: #334155; }
    .btn-secondary:hover { background: #e2e8f0; }
    .profile { display: flex; flex-direction: column; gap: 12px; }
    .profile-header { display: flex; justify-content: space-between; align-items: center; }
    .profile-name { font-weight: 600; }
    .profile-email { font-size: 12px; color: #64748b; }
    .error { color: #dc2626; font-size: 12px; }
    .success { color: #16a34a; font-size: 12px; }
    .divider { height: 1px; background: #e2e8f0; margin: 12px 0; }
  </style>
</head>
<body>
  <div class="container" id="app">
    <h1>⚡ Job Tracker</h1>
    <div id="content">Loading...</div>
  </div>
  <script type="module" src="./popup.ts"></script>
</body>
</html>
